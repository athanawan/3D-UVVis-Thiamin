#ikv h3{margin:16px 0 6px;font-size:14px;letter-spacing:0;text-transform:none;color:#111}#ikv ol{margin:4px 0;padding-left:26px}#ikv li{margin:4px 0}

<script>
(()=>{
const $=id=>document.getElementById(id);
if(!window.THREE||!THREE.OrbitControls){$('view').innerHTML='<p style="padding:20px">Pustaka Three.js gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.</p>';return;}
const H=Math.PI/2;

/* ===== 1. DATA KOMPONEN: [Nama, Fungsi, Prinsip kerja, Hubungan dengan analisis, Contoh masalah, posisi label] ===== */
const D={
lampD2:["Lampu Deuterium (D₂)","Lampu ini dipakai sebagai sumber sinar ultraviolet (±190–340 nm). Karena Thiamin diukur pada λ ≈ 246 nm, lampu D₂-lah yang dipakai selama pengukuran.","Gas deuterium bertekanan rendah dialiri arus listrik, sehingga molekulnya tereksitasi dan sinar UV yang kontinu dipancarkan. Lampu perlu dipanaskan dulu (warm-up) 15–30 menit supaya intensitasnya stabil.","Intensitas sinar (I₀) yang stabil sangat menentukan baseline dan kelinearan kurva kalibrasi.","Lampu yang hampir habis umurnya ditandai noise tinggi dan energi rendah; bila belum cukup dipanaskan, baseline akan bergeser; jendela lampu yang kotor juga menurunkan energi.",[2.35,1.15,-.38]],
lampW:["Lampu Tungsten-Halogen (W)","Lampu ini dipakai sebagai sumber sinar daerah tampak dan IR dekat (±330–1100 nm).","Filamen tungsten dipijarkan hingga berpendar. Gas halogen di dalamnya membuat tungsten yang menguap dikembalikan ke filamen, sehingga umur lampu lebih panjang.","Pada pengukuran Thiamin (daerah UV) lampu W tidak dipakai. Lampu ini baru dipakai bila spektrum yang dipindai melewati ±340 nm, dan pergantian lampu dilakukan otomatis oleh instrumen.","Filamen yang putus menyebabkan tidak ada energi di daerah tampak; lampu yang tersentuh tangan telanjang akan terkontaminasi dan cepat rusak.",[2.35,1.2,.38]],
mono:["Monokromator","Bagian ini memisahkan sinar polikromatik dari lampu sehingga hanya panjang gelombang yang diinginkan (246 nm) yang diteruskan.","Cahaya masuk lewat celah, dipantulkan cermin kolimator ke kisi difraksi, lalu sinar yang sudah terurai difokuskan kembali oleh cermin fokus menuju celah keluar. Panjang gelombang diubah dengan cara memutar kisi.","Ketepatan λ sangat berpengaruh pada sensitivitas, karena Thiamin diukur tepat di puncak serapannya. Sinar yang sempit juga membantu menjaga kepatuhan terhadap Hukum Beer–Lambert.","Panjang gelombang yang bergeser perlu dikalibrasi ulang; kisi yang terkena uap asam atau cermin yang berembun akan memunculkan stray light.",[.3,1.45,-.4]],
slit:["Celah (Slit)","Lebar pita spektral (misalnya 1 nm) dan jumlah energi yang lolos diatur oleh celah masuk dan celah keluar.","Celah yang sempit menghasilkan resolusi tinggi tetapi energi rendah; celah yang lebar sebaliknya, energi tinggi tetapi puncak melebar.","Untuk puncak Thiamin yang cukup lebar, celah 1 nm sudah memberi keseimbangan yang baik antara noise dan resolusi.","Celah yang terlalu lebar menyebabkan penyimpangan dari Beer–Lambert, sedangkan celah yang terlalu sempit membuat noise meningkat.",[1.4,1.2,-.9]],
bs:["Beam Splitter (Pembagi Berkas)","Berkas monokromatis dibagi menjadi dua oleh bagian ini: satu menuju cuvet sampel dan satu lagi menuju cuvet referensi (double-beam).","Sebagian cahaya diteruskan oleh plat setengah-cermin ke cuvet referensi, sedangkan sisanya dipantulkan ke cuvet sampel melalui sebuah cermin.","Dengan sistem double-beam, I dan I₀ diukur bersamaan sehingga drift lampu dikoreksi otomatis dan baseline lebih stabil.","Plat yang kotor atau tergores akan merusak keseimbangan kedua berkas, sehingga baseline miring.",[-.95,1.25,-.5]],
cuvComp:["Kompartemen Cuvet","Dua cuvet (referensi dan sampel) ditempatkan di sini, tepat pada jalur berkas, dan dilindungi dari cahaya luar oleh tutup. Tutup dibuka dan ditutup dengan cara diklik.","Cuvet ditahan oleh holder dalam posisi tegak lurus terhadap berkas sehingga jalur optik b = 1 cm tetap terjaga. Tutup harus ditutup rapat selama pengukuran agar tidak ada cahaya luar yang masuk.","Posisi cuvet yang tetap membuat b konstan, jadi absorbansi hanya dipengaruhi oleh konsentrasi (A = ε·b·c).","Tutup yang tidak rapat menimbulkan stray light dan nilai A tidak stabil; tumpahan HCl di holder dapat menyebabkan korosi dan pembacaan yang salah.",[-1.67,1.75,-.5]],
cuvette:["Cuvet Kuarsa","Larutan standar, sampel, dan blanko ditampung di dalam cuvet ini. Lebar jalur optiknya 1 cm, dan ukurannya dibuat kecil karena hanya sekitar 3 mL larutan yang dibutuhkan.","Kuarsa tetap tembus cahaya hingga ±190 nm, sedangkan kaca biasa dan plastik sudah menyerap sinar di bawah ±320 nm sehingga tidak boleh dipakai untuk UV. Cuvet dipegang pada sisi buram dan dibilas dengan larutan yang akan diukur.","Cuvet referensi diisi blanko (HCl 1:60), sedangkan cuvet sampel diisi larutan yang diukur, dimulai dari konsentrasi terkecil.","Sidik jari, gelembung udara, atau goresan membuat pembacaan A salah; cuvet yang tidak dibilas menyebabkan carry-over antar larutan.",[-1.67,1.3,-.1]],
detector:["Detektor (PMT / Fotodioda)","Intensitas cahaya yang lolos (I dan I₀) diubah menjadi sinyal listrik oleh detektor.","Pada PMT, elektron dibebaskan dari fotokatoda oleh foton, lalu dilipatgandakan oleh deretan dinoda. Pada fotodioda, foton langsung diubah menjadi arus. Sinyal yang dihasilkan dikuatkan dan dikirim ke PC.","Rasio I/I₀ diubah menjadi transmitans T, kemudian absorbansi A = −log T ditampilkan pada layar dan software.","Kebocoran cahaya, PMT yang sudah lelah, atau dark current yang tinggi akan menyebabkan noise dan baseline yang tidak stabil.",[-2.1,1.2,-.5]],
display:["Layar LCD Instrumen","Status instrumen, panjang gelombang (λ), absorbansi (Abs), dan mode pengukuran ditampilkan di layar ini, yang tertanam pada panel kontrol miring di bagian atas instrumen.","Sinyal detektor dibaca oleh mikroprosesor dan tampilan diperbarui secara berkala. Instrumen juga dihubungkan ke PC melalui kabel USB.","Dari layar ini bisa segera diketahui bahwa λ sudah 246 nm, lampu sudah menyala, dan pembacaan sudah stabil.","Bila kode kesalahan self-check (lampu/kisi) muncul, buku IK harus dibuka dan teknisi dihubungi.",[1.43,1.32,.68]],
power:["Tombol Power Instrumen","Instrumen dinyalakan dan dimatikan dengan tombol ini. Tombol hijau pada panel kontrol miring (di bawah layar) cukup diklik.","Begitu dinyalakan, self-check dijalankan: lampu, motor kisi, filter, dan kalibrasi λ diperiksa. Prosesnya memakan waktu ±1–3 menit.","Instrumen dan UPS harus sudah menyala sebelum software dapat dihubungkan. Saat dimatikan, software ditutup lebih dulu, baru instrumen dimatikan.","Bila instrumen dimatikan ketika software masih terhubung, data bisa hilang; bila inisialisasi tidak ditunggu, koneksi akan error.",[2.51,.9,1.4]],
ups:["UPS","Daya listrik instrumen, CPU, dan monitor dijaga tetap stabil oleh UPS, sehingga alat tidak mati mendadak saat tegangan turun. Tombol hijau diklik untuk ON/OFF.","Saat tegangan PLN turun atau padam, listrik disuplai oleh baterai melalui inverter selama beberapa menit.","Fluktuasi listrik dapat merusak lampu dan elektronik, karena itu UPS selalu dinyalakan lebih dulu (IK A.1).","Baterai yang lemah tidak akan bertahan saat listrik padam; UPS yang dimatikan sebelum komputer shutdown dapat merusak data.",[-4.7,1.0,-.4]],
pc:["PC & Monitor (UVProbe)","Software UVProbe/LabSolutions UV-Vis dijalankan di sini: mode diatur, baseline dikoreksi, λmax dipindai, standar diukur, dan kurva kalibrasi disusun. Layar diklik untuk membuka tabel perhitungan.","Sinyal dari instrumen dibaca oleh software, absorbansi dihitung, lalu regresi linear y = a + bx dibuat. Konsentrasi sampel kemudian dihitung dari persamaan tersebut.","Di sinilah sinyal absorbansi diubah menjadi kadar Thiamin (mg/L → mg/tablet dan mg/kg).","Baseline yang belum diatur (autozero), koneksi USB yang terputus, atau kurva yang tidak linear (r rendah) adalah masalah yang paling sering ditemui.",[5,1.95,.3]],
flask:["Labu Takar Sampel Presisi 1–5","Lima labu takar 200 mL berisi larutan sampel tablet Vitamin B1 yang dibuat berulang (Presisi 1 sampai 5) untuk mengetahui ketelitian cara kerja.","Setiap labu diisi serbuk tablet yang ditimbang sendiri-sendiri, dilarutkan dengan HCl 1:60, ditepatkan sampai tanda tera, lalu disaring. Filtrat jernih yang diperoleh kemudian diukur langsung tanpa pengenceran.","Hasil kelima ulangan dipakai untuk menghitung %RSD. Syaratnya ≤ 2 %; makin kecil nilainya, makin baik presisi analisisnya.","Meniskus yang tidak tepat tera, larutan yang tidak homogen, atau partikel yang tidak tersaring akan menyebabkan hamburan cahaya dan A yang terlalu tinggi, sehingga %RSD membesar.",[-6.0,1.3,2.5]],
akur:["Labu Takar Sampel Akurasi (Spike)","Labu takar berisi sampel yang sudah ditambah larutan standar Thiamin (spike) dalam jumlah tertentu.","Sampel dipreparasi seperti sampel Presisi, kemudian larutan standar ditambahkan (spike 5 mL dari 100 mg/L). Selisih konsentrasi sebelum dan sesudah penambahan dibandingkan dengan jumlah yang ditambahkan.","Dari sini %Recovery dihitung. Syaratnya 85–115 %, yang menunjukkan bahwa metode tidak terganggu oleh matriks tablet.","Pemipetan spike yang tidak akurat atau larutan yang tidak homogen menyebabkan %Recovery keluar dari rentang syarat.",[-3.2,1.2,2.5]],
std:["Deret Standar Thiamin (0–25 mg/L)","Enam labu takar 100 mL berisi standar 0, 5, 10, 15, 20, dan 25 mg/L.","Larutan induk 1000 mg/L dipipet sebanyak 0; 0,5; 1,0; 1,5; 2,0; dan 2,5 mL, lalu ditepatkan dengan HCl 1:60 sampai tanda tera (C₁V₁ = C₂V₂).","Absorbansi standar dipakai untuk membuat kurva kalibrasi y = bx + a dengan r² ≈ 0,997.","Pemipetan yang kurang teliti atau larutan yang tidak dihomogenkan membuat kurva tidak linear.",[-1.4,.95,2.5]],
hcl:["Gelas Piala Plastik Bergagang (HCl 1:60)","Larutan pengencer HCl 1:60 ditampung di dalam gelas piala plastik bergagang ini, sehingga mudah dituang dan tidak mudah pecah.","HCl pekat diencerkan dengan air dengan perbandingan 1 : 60 (asam selalu ditambahkan ke dalam air). Thiamin HCl stabil dalam suasana asam dan mudah rusak dalam suasana basa.","Larutan ini dipakai untuk melarutkan, mengencerkan, dan sebagai blanko. Blanko HCl 1:60 juga dipakai sebagai referensi (autozero), sehingga serapan pelarut tidak ikut terukur.","APD wajib dipakai (jas lab, sarung tangan, kacamata); bila pelarut blanko dan sampel berbeda, baseline akan bergeser.",[1.4,1.0,2.5]],
ik:["Buku Instruksi Kerja (IK)","Panduan tertulis penggunaan Spektrofotometer UV-Vis double-beam dimuat di dalam buku ini: persiapan, pengoperasian, dan cara mematikan alat. Bukunya diklik untuk dibaca.","Urutan kerja yang baku diikuti oleh analis: persiapan → pengoperasian (baseline, scan λmax, pengukuran standar dan sampel) → alat dimatikan dan area kerja dirapikan.","Urutan yang baku menjaga keselamatan, umur lampu, dan keterulangan hasil.","Langkah yang terlewat (misalnya warm-up atau autozero) membuat data tidak valid; Log Book yang tidak diisi juga menyulitkan penelusuran.",[-9.0,.5,2.3]],
hood:["Lemari Asam (Fume Hood)","Pekerjaan dengan bahan kimia yang uapnya berbahaya, misalnya HCl pekat, dilakukan di dalam lemari ini. Uapnya dihisap ke atas dan dibuang melalui saluran duct.","Aliran udara masuk melalui bukaan sash ditimbulkan oleh kipas penghisap, sehingga uap tidak mengarah ke wajah analis. Sash diturunkan serendah mungkin saat bekerja.","HCl pekat diencerkan menjadi HCl 1:60 di dalam lemari asam, dan asam selalu ditambahkan ke dalam air.","Sash yang terlalu terbuka membuat aliran udara tidak efektif; bila kipas mati, uap asam akan menyebar ke ruangan.",[8.4,2.6,-1.2]],
board:["Papan Tulis Alur Analisis","Tujuh tahap penetapan kadar Thiamin, beserta rumus dan syarat validasi (R², %RSD, %Recovery), dirangkum di papan tulis ini.","Alur analisis disusun berurutan: alat disiapkan, larutan dibuat, sampel dipreparasi, λ maksimum ditentukan, absorbansi diukur, dan kadar dihitung.","Urutan yang jelas menjaga keterulangan hasil dan memudahkan penelusuran bila terjadi penyimpangan.","Tahap yang terlewat (misalnya autozero) membuat data tidak dapat dipertanggungjawabkan.",[-2.6,6.1,-3.5]],
spec:["Poster Daerah Spektrum UV–Vis","Daerah UV (190–400 nm), tampak (400–700 nm), dan IR dekat ditunjukkan pada poster ini, lengkap dengan rentang kerja lampu D₂ dan tungsten-halogen.","Lampu D₂ dipakai untuk daerah UV dan lampu W untuk daerah tampak; pergantian lampu dilakukan otomatis di sekitar 330–340 nm.","Thiamin diukur pada λ maksimum 246 nm, sehingga lampu D₂ yang dipakai.","Bila lampu tidak sesuai dengan daerah pengukuran, energi akan rendah dan noise tinggi.",[3.4,6.1,-3.5]],
bl:["Poster Hukum Beer–Lambert","Hubungan antara intensitas cahaya datang (I₀), intensitas yang diteruskan (I), tebal cuvet (b), dan konsentrasi (c) digambarkan pada poster ini.","Absorbansi dinyatakan sebagai A = −log T = log(I₀/I) = ε·b·c; absorbansi berbanding lurus dengan konsentrasi pada daerah linear (A ≈ 0,1–1).","Hukum ini menjadi dasar kurva kalibrasi y = bx + a dan perhitungan kadar Thiamin.","Konsentrasi yang terlalu tinggi, sinar yang tidak monokromatis, atau stray light menyebabkan kurva menyimpang dari linearitas.",[6.95,6.1,-3.5]],
ptab:["Poster Tabel Periodik","Unsur-unsur ditampilkan pada poster ini, dan unsur penyusun Thiamin HCl (H, C, N, O, S, Cl) diberi tanda.","Cincin pirimidin dan tiazol pada Thiamin tersusun dari C, N, dan S dengan ikatan rangkap terkonjugasi, yang menyerap sinar UV.","Pengetahuan tentang unsur penyusun membantu pemahaman tentang kromofor dan perhitungan massa molekul relatif.","—",[-8.1,6.1,-3.5]],
k3:["Rambu Keselamatan Kerja (K3)","Penggunaan APD, bahaya radiasi UV, bahan korosif, larangan makan/minum, pencuci mata darurat, dan kacamata pelindung diingatkan oleh rambu-rambu ini.","Rambu dipasang setinggi pandangan analis agar aturan keselamatan selalu teringat.","HCl 1:60 bersifat korosif dan lampu D₂ memancarkan UV, sehingga APD wajib dipakai dan kompartemen ditutup saat pengukuran.","Rambu yang rusak atau terhalang membuat aturan K3 terabaikan; APD yang tidak lengkap meningkatkan risiko cedera akibat bahan kimia.",[-.2,3.8,-3.5]],
apar:["Alat Pemadam Api Ringan (APAR)","Api yang masih kecil, misalnya akibat korsleting listrik atau bahan mudah terbakar, dapat dipadamkan dengan alat ini.","Pin pengaman ditarik, tuas ditekan, lalu bahan pemadam disemprotkan ke pangkal api.","Laboratorium dipenuhi listrik, pelarut organik (etanol), dan instrumen, sehingga APAR harus selalu siap dipakai.","Jarum manometer di zona merah atau APAR yang sudah kedaluwarsa tidak dapat dipakai.",[10.1,2.2,1.8]],
reagen:["Rak Reagen","Botol-botol reagen yang sering dipakai disimpan di rak ini.","Setiap botol diberi label yang jelas; reagen yang tidak kompatibel dipisahkan, dan bahan yang peka cahaya disimpan dalam botol gelap.","Reagen HCl dan standar Thiamin diambil dari rak ini pada tahap persiapan.","Label yang pudar membuat reagen tertukar; botol yang dibiarkan terbuka menyebabkan kontaminasi atau penguapan.",[-10.2,5.0,-.6]],
body:["Bodi Instrumen","Komponen optik dan elektronik dilindungi oleh cangkang ini. Mode Tembus Pandang dapat diaktifkan untuk melihat bagian dalamnya.","Getaran diredam oleh rangka yang kokoh, dan jalur optik ditutup rapat agar terbebas dari debu dan cahaya luar.","Jalur cahaya dijaga tetap sejajar sehingga baseline stabil.","Bila instrumen digeser atau terkena getaran, optik bisa tidak sejajar; ventilasi yang tertutup membuat panas berlebih.",[1.0,1.75,1.5]]

/* ===== Loop ===== */
const clock=new THREE.Clock(),v3=new THREE.Vector3();let lcdT0=0;
function resize(){const w=view.clientWidth,h=view.clientHeight;if(!w||!h)return;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(view);resize();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 if(pcBoot>0){pcBoot-=dt;if(pcBoot<=0){pcBoot=0;refreshPower();}else drawPC();}
 updateSim(dt*SPD);
 if(tour){tour.t+=dt;if(tour.i<0||tour.t>=6.5){tour.i++;tour.t=0;if(tour.i>=TOUR.length){stopTour();flyTo(HOME.p,HOME.t);}else{const s=TOUR[tour.i];flyTo(...s.c);if(!sim&&!beamForce)setXray(!!s.x);caption(s.t,s.d);}}}
 if(goal){camera.position.lerp(goal.p,.06);controls.target.lerp(goal.t,.06);if(camera.position.distanceTo(goal.p)<.03)goal=null;}controls.update();{const b=camB();clampV(camera.position,b.p);clampV(controls.target,b.t);}
 lid.rotation.x+=((lidOpen?-1.7:0)-lid.rotation.x)*.1;
 FL.forEach(F=>{F.cur+=(F.goal-F.cur)*Math.min(1,dt*1.5);F.liq.scale.y=Math.max(.001,F.cur);F.liq.visible=F.cur>.02;F.mat.color.lerp(F.colGoal,.06);});
 CV.forEach(F=>F.mat.color.lerp(F.goal,.08));
 FANS.forEach(f=>f.rotation.z+=cpuOn?dt*10:0);
 const lampTarget=(upsOn&&instOn)?1:0;lampLvl+=(lampTarget-lampLvl)*Math.min(1,dt*(lampTarget?.3:1.5));
 const flick=.85+.15*Math.sin(t*12),d2=lampLvl*flick,wl2=lampLvl*.6;
 d2Glow.material.opacity=d2*.8;wGlow.material.opacity=wl2*.8;lampLight.intensity=lampLvl*1.2;
 const bOn=lampLvl>.2&&(beamOn||beamForce);Tsamp=sim?Tsamp:(beamForce?Math.pow(10,-.25):1);
 BEAMS.forEach(b=>{const o=.85*(b.post===1?Math.max(.12,Tsamp):1)*lampLvl,vb=(bOn&&xray)?1:0;b.m.material.opacity=o*vb;b.m.userData.core.material.opacity=Math.min(1,o*vb*1.1);});
 phUpdate(dt,bOn&&xray,Tsamp);
 if(t-lcdT0>.15){lcdT0=t;syncNav();drawLCD();if(sim&&(scr.mode==='meas'||scr.mode==='scan'))drawPC();}
 const k=.3+.22*Math.sin(t*4);pick.forEach(m=>{const mm=m.material;if(!mm.emissive)return;const id=m.userData.id;
  if(m.userData.upsBtn||m.userData.cpuBtn||m.userData.monBtn||m===pwrBtn){return;}
  mm.emissive.setHex(0x14b8a6);mm.emissiveIntensity=id===selected?k+.25:hl.has(id)?k:id===hover?.18:0;});
 {const nd=new Date();clockS.rotation.z=-nd.getSeconds()/60*Math.PI*2;clockM.rotation.z=-(nd.getMinutes()+nd.getSeconds()/60)/60*Math.PI*2;clockH.rotation.z=-((nd.getHours()%12)+nd.getMinutes()/60)/12*Math.PI*2;}
 ledRdy.material.color.set(upsOn&&instOn?(lampLvl>.95?0x34d399:0xfbbf24):0x3a1a1a);
 const W=view.clientWidth,Hh=view.clientHeight;
 for(const id in labels){const l=labels[id];if(!labelsOn){l.style.display='none';continue;}v3.set(...D[id][5]).project(camera);if(v3.z>1){l.style.display='none';continue;}l.style.display='block';l.style.left=(v3.x*.5+.5)*W+'px';l.style.top=(-v3.y*.5+.5)*Hh+'px';}
 renderer.render(scene,camera);}

/* ===== UI umum ===== */
$('mBtn').onclick=()=>stage.classList.toggle('hl');
$('aBtn').onclick=()=>stage.classList.toggle('hm');$('mX').onclick=()=>stage.classList.add('hm');
$('menu').addEventListener('click',e=>{if(isMob()&&e.target.tagName==='BUTTON'&&e.target.id!=='bSpd'&&e.target.id!=='mX')stage.classList.add('hm');});
function syncNav(){$('aBtn').classList.toggle('on',!stage.classList.contains('hm'));$('mBtn').classList.toggle('on',!stage.classList.contains('hl'));$('iBtn').classList.toggle('on',!stage.classList.contains('hr'));}
$('iBtn').onclick=()=>stage.classList.toggle('hr');
const appEl=$('app');
function setFull(v){appEl.classList.toggle('full',v);$('bFull').textContent=v?'⛶ Keluar Layar Penuh':'⛶ Layar Penuh';
 try{if(v&&!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(!v&&document.fullscreenElement)document.exitFullscreen();}catch(e){}
 setTimeout(resize,350);}
$('bFull').onclick=$('fsBtn').onclick=()=>setFull(!appEl.classList.contains('full'));$('fsX').onclick=()=>setFull(false);
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&appEl.classList.contains('full'))setFull(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&appEl.classList.contains('full'))setFull(false);});
if(isMob()){stage.classList.add('hl');stage.classList.add('hm');}else stage.classList.remove('hr');
root.traverse(o=>{const m=o.isMesh&&o.material;if(m&&m.isMeshStandardMaterial)m.envMapIntensity=.65;});
resetDisplay();FL.forEach(F=>{F.cur=F.goal;F.liq.scale.y=Math.max(.001,F.cur);F.liq.visible=F.cur>.02;F.mat.color.copy(F.colGoal);});CV.forEach(F=>F.mat.color.copy(F.goal));
refreshPower();welcome();setMode('overview');loop();
})();
