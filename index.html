/* ===== 1. DATA KOMPONEN: [Nama, Fungsi, Prinsip kerja, Hubungan dengan analisis, Contoh masalah, posisi label] ===== */
const D={
lampD2:["Lampu Deuterium (D₂)","Sumber radiasi kontinu daerah ultraviolet (±190–340 nm). Dipakai untuk mengukur Thiamin pada λ ≈ 246 nm.","Arus listrik melewati gas deuterium bertekanan rendah; molekul D₂ tereksitasi lalu terdisosiasi dan memancarkan spektrum kontinu UV. Lampu perlu pemanasan (warm-up) 15–30 menit agar intensitasnya stabil.","Thiamin menyerap kuat di daerah UV, sehingga D₂ adalah sumber yang aktif saat λ < ±340 nm. Intensitas I₀ yang stabil menentukan baseline dan kelinearan kurva kalibrasi.","Lampu hampir habis umur → noise tinggi dan energi turun; belum warm-up → baseline drift; jendela lampu kotor → energi rendah.",[-1.95,1.15,-.38]],
lampW:["Lampu Tungsten-Halogen (W)","Sumber radiasi kontinu daerah tampak dan IR dekat (±330–1100 nm).","Filamen tungsten dipanaskan hingga berpijar (pijar, bukan pelepasan gas); gas halogen mengembalikan tungsten yang menguap ke filamen sehingga umur lebih panjang.","Pada Thiamin (UV) lampu W tidak dipakai; instrumen berpindah otomatis dari D₂ ke W pada ±340 nm saat pemindaian spektrum yang luas.","Filamen putus → tidak ada energi di daerah tampak; lampu disentuh tangan telanjang → permukaan terkontaminasi.",[-1.95,1.2,.38]],
mono:["Monokromator","Memisahkan radiasi polikromatik dari lampu menjadi radiasi hampir monokromatik pada panjang gelombang yang dipilih (246 nm).","Konfigurasi Czerny–Turner: celah masuk → cermin kolimator → kisi difraksi (grating) mendispersi cahaya → cermin fokus → celah keluar. Memutar kisi mengubah panjang gelombang yang lolos.","Ketepatan λ menentukan sensitivitas pada puncak serapan Thiamin; radiasi yang sempit menjaga kepatuhan terhadap Hukum Beer–Lambert.","Pergeseran panjang gelombang (perlu kalibrasi), kisi terkontaminasi uap asam, cermin berembun → stray light.",[-.2,1.45,-.4]],
slit:["Celah (Slit)","Celah masuk dan celah keluar mengatur lebar pita spektral (spectral bandwidth, mis. 1 nm) dan jumlah energi yang lewat.","Celah sempit → resolusi tinggi tetapi energi rendah; celah lebar → energi tinggi tetapi puncak melebar.","Untuk puncak Thiamin yang cukup lebar, celah 1 nm memberi keseimbangan antara noise dan resolusi.","Celah terlalu lebar → penyimpangan Beer–Lambert; celah terlalu sempit → noise tinggi.",[-1,1.2,-.9]],
bs:["Beam Splitter (Pembagi Berkas)","Membagi berkas monokromatis menjadi dua: berkas sampel dan berkas referensi (double-beam).","Plat setengah-cermin meneruskan sebagian cahaya ke cuvet referensi dan memantulkan sisanya ke cuvet sampel melalui cermin.","Sistem double-beam mengukur I dan I₀ bersamaan sehingga drift lampu terkoreksi otomatis dan baseline lebih stabil.","Plat kotor atau tergores → keseimbangan berkas rusak, baseline miring.",[1.35,1.25,-.5]],
cuvComp:["Kompartemen Cuvet","Tempat dua cuvet (referensi dan sampel) pada jalur berkas dan terlindung dari cahaya luar oleh tutup. Klik tutup untuk membuka/menutup.","Holder menjaga cuvet tegak lurus berkas dengan jalur optik b = 1 cm. Tutup harus tertutup rapat saat pengukuran agar tidak ada cahaya luar masuk.","Posisi cuvet yang tetap menjaga b konstan sehingga A hanya bergantung pada konsentrasi (A = ε·b·c).","Tutup tidak rapat → stray light, nilai A tidak stabil; tumpahan larutan HCl di holder → korosi dan pembacaan salah.",[1.9,1.6,-.5]],
cuvette:["Cuvet Kuarsa","Wadah larutan standar/sampel/blanko dengan lebar jalur optik 1 cm.","Kuarsa transparan hingga ±190 nm; kaca biasa dan plastik menyerap di bawah ±320 nm sehingga tidak boleh dipakai untuk UV. Pegang pada sisi buram, bilas dengan larutan yang akan diukur.","Cuvet referensi berisi blanko (HCl 1:60), cuvet sampel berisi larutan yang diukur dari konsentrasi terkecil ke terbesar.","Sidik jari, gelembung udara, goresan → pembacaan A salah; cuvet tidak dibilas → carry-over.",[1.9,1.25,-.1]],
detector:["Detektor (PMT / Fotodioda)","Mengubah intensitas cahaya yang lolos (I dan I₀) menjadi sinyal listrik.","Pada PMT, foton membebaskan elektron di fotokatoda lalu digandakan oleh deretan dinoda; fotodioda mengubah foton langsung menjadi arus. Sinyal dikuatkan dan dikirim ke PC.","Rasio I/I₀ diubah menjadi transmitans T dan absorbansi A = −log T yang ditampilkan pada layar dan software.","Kebocoran cahaya, PMT lelah, dark current tinggi → noise dan baseline tidak stabil.",[2.55,1.2,-.5]],
display:["Layar LCD Instrumen","Menampilkan status instrumen, panjang gelombang (λ), absorbansi (Abs), dan mode pengukuran.","Mikroprosesor membaca sinyal detektor dan memperbarui tampilan secara berkala; instrumen juga terhubung ke PC lewat kabel USB.","Memberi umpan balik cepat bahwa λ sudah 246 nm, lampu aktif, dan pembacaan sudah stabil.","Kode kesalahan self-check (lampu/kisi) → ikuti buku IK dan hubungi teknisi.",[-.8,1.4,1.55]],
power:["Tombol Power Instrumen","Menyalakan/mematikan instrumen. Klik tombol hijau pada panel depan.","Saat dinyalakan, instrumen melakukan self-check: lampu, motor kisi, filter, dan kalibrasi λ. Proses ±1–3 menit.","Instrumen harus ON dan UPS ON sebelum software dapat terhubung. Mematikan alat: keluar software dulu, baru matikan alat.","Alat dimatikan saat software masih terhubung → data hilang; tidak menunggu inisialisasi → error koneksi.",[-1.95,.6,1.55]],
ups:["UPS","Memberi daya stabil untuk instrumen, CPU, dan monitor serta mencegah mati mendadak saat listrik turun. Klik tombol hijau untuk ON/OFF.","Baterai dan inverter menyuplai listrik saat tegangan PLN turun atau padam beberapa menit.","Fluktuasi listrik dapat merusak lampu dan elektronik; UPS dinyalakan pertama (IK A.1).","Baterai lemah → tidak bertahan saat padam; UPS dimatikan sebelum komputer shutdown → data korup.",[-4.7,1.0,-.4]],
pc:["PC & Monitor (UVProbe)","Menjalankan software UVProbe/LabSolutions UV-Vis: mengatur mode (Spectrum/Photometric/Quantitation), baseline, memindai λmax, mengukur standar, dan menyusun kurva kalibrasi. Klik layar untuk membuka tabel perhitungan.","Software membaca sinyal instrumen, menghitung A, membuat regresi linear y = a + bx, dan menghitung konsentrasi sampel dari persamaan kalibrasi.","Sinyal absorbansi berubah menjadi kadar Thiamin (mg/L → mg/tablet dan mg/kg).","Baseline tidak diatur (autozero), komunikasi USB putus, kurva tidak linear (r rendah).",[5,1.95,.3]],
flask:["Labu Takar 200 mL Sampel","Menampung larutan sampel serbuk tablet Vitamin B1 yang dilarutkan dalam HCl 1:60 hingga tanda tera.","Serbuk ditimbang, dilarutkan dengan sonikasi, ditepatkan sampai tanda tera, lalu disaring; filtrat diencerkan (pipet 5 mL → labu 100 mL).","Volume akurat dan filtrat jernih menjamin A mewakili Thiamin pada sampel.","Meniskus tidak tepat tera, larutan tidak homogen, partikel tidak disaring → hamburan cahaya dan A terlalu tinggi.",[-3.2,1.3,2.3]],
std:["Deret Standar Thiamin (0–25 mg/L)","Enam labu takar 100 mL berisi standar 0, 5, 10, 15, 20, dan 25 mg/L.","Dibuat dengan memipet 0; 0,5; 1,0; 1,5; 2,0; 2,5 mL larutan induk 1000 mg/L, lalu ditepatkan dengan HCl 1:60 sampai tanda tera (C₁V₁ = C₂V₂).","Absorbansi standar membentuk kurva kalibrasi y = bx + a dengan r² ≈ 0,997.","Kesalahan pemipetan, standar tidak dibuat dari labu yang sama, tidak dihomogenkan → kurva tidak linear.",[-1.4,.95,2.5]],
stock:["Larutan Induk Thiamin 1000 mg/L","Sumber pembuatan deret standar dan larutan spike.","Thiamin HCl standar (±100 mg) ditimbang, dilarutkan dalam HCl 1:60, dan ditepatkan dalam labu takar 100 mL.","Ketelitian penimbangan menentukan seluruh kurva kalibrasi.","Penimbangan tidak teliti, standar higroskopis menyerap air, penyimpanan terkena cahaya.",[-4.3,1.2,2.3]],
hcl:["Larutan HCl 1:60 (Pelarut)","Pelarut standar, sampel, dan blanko; menjaga Thiamin stabil dalam suasana asam.","Satu bagian HCl pekat diencerkan dengan 59 bagian air (selalu tambahkan asam ke air). Thiamin HCl stabil pada pH asam dan mudah rusak pada pH basa.","Blanko HCl 1:60 dipakai sebagai referensi (autozero) sehingga serapan pelarut tidak ikut terukur.","Penggunaan APD diwajibkan (jas lab, sarung tangan, kacamata); pelarut tidak sama untuk blanko dan sampel → baseline bergeser.",[1.4,1.0,2.5]],
ik:["Buku Instruksi Kerja (IK)","Pedoman tertulis penggunaan Spektrofotometer UV-Vis double-beam: persiapan, pengoperasian, dan mematikan alat. Klik buku untuk membacanya.","Analis mengikuti urutan baku: persiapan → pengoperasian (baseline, scan λmax, ukur standar & sampel) → mematikan alat dan merapikan area kerja.","Urutan yang baku menjaga keselamatan, umur lampu, dan keterulangan hasil.","Langkah terlewat (mis. tidak warm-up/autozero) → data tidak valid; Log Book tidak diisi.",[-6.0,.5,2.3]],
body:["Bodi Instrumen","Cangkang pelindung komponen optik dan elektronik. Aktifkan Tembus Pandang untuk melihat bagian dalam.","Rangka kokoh meredam getaran dan menutup rapat jalur optik agar bebas debu dan cahaya luar.","Menjaga jalur cahaya tetap sejajar sehingga baseline stabil.","Instrumen digeser/terkena getaran → optik tidak sejajar; ventilasi tertutup → panas berlebih.",[1.0,1.95,1.5]]
};

function add(geo,m,x,y,z,id,o={}){const me=new THREE.Mesh(geo,m.clone());me.position.set(x,y,z);

function plate(t,w,h,x,y,z,bg,fg,par){const c=document.createElement('canvas');c.width=1024;c.height=Math.max(32,Math.round(1024*h/w));const g=c.getContext('2d');
 if(bg){g.fillStyle=bg;g.fillRect(0,0,1024,c.height);}g.fillStyle=fg;g.font='bold '+Math.round(c.height*.5)+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t,512,c.height/2,980);

function resize(){const w=view.clientWidth,h=view.clientHeight;if(!w||!h)return;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(view);resize();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 if(pcBoot>0){pcBoot-=dt;if(pcBoot<=0){pcBoot=0;refreshPower();}else drawPC();}
 updateSim(dt);
 if(goal){camera.position.lerp(goal.p,.06);controls.target.lerp(goal.t,.06);if(camera.position.distanceTo(goal.p)<.03)goal=null;}controls.update();
 lid.rotation.x+=((lidOpen?-1.7:0)-lid.rotation.x)*.1;
 FL.forEach(F=>{F.cur+=(F.goal-F.cur)*Math.min(1,dt*1.5);F.liq.scale.y=Math.max(.001,F.cur);F.liq.visible=F.cur>.02;F.mat.color.lerp(F.colGoal,.06);});
 CV.forEach(F=>F.mat.color.lerp(F.goal,.08));
 FANS.forEach(f=>f.rotation.z+=cpuOn?dt*10:0);
 const lampTarget=(upsOn&&instOn)?1:0;lampLvl+=(lampTarget-lampLvl)*Math.min(1,dt*(lampTarget?.3:1.5));
 const flick=.85+.15*Math.sin(t*12),d2=lampLvl*flick,wl2=lampLvl*.6;
 d2Glow.material.opacity=d2*.8;wGlow.material.opacity=wl2*.8;lampLight.intensity=lampLvl*1.2;
 const bOn=lampLvl>.2&&(beamOn||beamForce);Tsamp=sim?Tsamp:(beamForce?Math.pow(10,-.25):1);
 BEAMS.forEach(b=>{const o=.85*(b.post===1?Math.max(.12,Tsamp):1)*lampLvl,vb=(bOn&&xray)?1:0;b.m.material.opacity=o*vb;b.m.userData.core.material.opacity=Math.min(1,o*vb*1.1);});
 phUpdate(dt,bOn&&xray,Tsamp);
 if(t-lcdT0>.15){lcdT0=t;drawLCD();if(sim&&(scr.mode==='meas'||scr.mode==='scan'))drawPC();}
 const k=.3+.22*Math.sin(t*4);pick.forEach(m=>{const mm=m.material;if(!mm.emissive)return;const id=m.userData.id;
  if(m.userData.upsBtn||m.userData.cpuBtn||m.userData.monBtn||m===pwrBtn){return;}
  mm.emissive.setHex(0x14b8a6);mm.emissiveIntensity=id===selected?k+.25:hl.has(id)?k:id===hover?.18:0;});
 const W=view.clientWidth,Hh=view.clientHeight;
 for(const id in labels){const l=labels[id];if(!labelsOn){l.style.display='none';continue;}v3.set(...D[id][5]).project(camera);if(v3.z>1){l.style.display='none';continue;}l.style.display='block';l.style.left=(v3.x*.5+.5)*W+'px';l.style.top=(-v3.y*.5+.5)*Hh+'px';}
 renderer.render(scene,camera);}

/* ===== UI umum ===== */
$('mBtn').onclick=()=>stage.classList.toggle('hl');
$('iBtn').onclick=()=>stage.classList.toggle('hr');
const appEl=$('app');
function setFull(v){appEl.classList.toggle('full',v);$('bFull').textContent=v?'⛶ Keluar Layar Penuh':'⛶ Layar Penuh';
 try{if(v&&!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(!v&&document.fullscreenElement)document.exitFullscreen();}catch(e){}
 setTimeout(resize,350);}
$('bFull').onclick=$('fsBtn').onclick=()=>setFull(!appEl.classList.contains('full'));$('fsX').onclick=()=>setFull(false);
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&appEl.classList.contains('full'))setFull(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&appEl.classList.contains('full'))setFull(false);});
['pipe','btns'].forEach(id=>{const el=$(id);el.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){el.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});});
if(isMob())stage.classList.add('hl');else stage.classList.remove('hr');
root.traverse(o=>{const m=o.isMesh&&o.material;if(m&&m.isMeshStandardMaterial)m.envMapIntensity=.65;});
resetDisplay();FL.forEach(F=>{F.cur=F.goal;F.liq.scale.y=Math.max(.001,F.cur);F.liq.visible=F.cur>.02;F.mat.color.copy(F.colGoal);});CV.forEach(F=>F.mat.color.copy(F.goal));
refreshPower();welcome();setMode('overview');loop();
})();
</script>
</body></html>
